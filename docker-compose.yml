# The database for running TrueSight on your own computer: PostgreSQL 16, the same version as the live site.
#
#   docker compose up -d      start it (Docker Desktop must be running)
#   docker compose ps         check it says "healthy"
#   docker compose down       stop it; your data is kept
#   docker compose down -v    stop it and delete all its data
#
# It listens on port 5530, not PostgreSQL's usual 5432, so it never clashes with another PostgreSQL on your computer.
# Need a different port? Put DB_PORT=5531 and DATABASE_URL=jdbc:postgresql://localhost:5531/truesight in your .env.

# Docker names the database and its saved data after this project name, whatever the folder is called. Docker only
# allows lowercase. If another project on your computer already uses "truesight", put COMPOSE_PROJECT_NAME=something-else
# in your .env: it takes priority over this line, and only affects your computer.
name: truesight

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truesight
      POSTGRES_USER: truesight
      POSTGRES_PASSWORD: truesight
    ports:
      - "${DB_PORT:-5530}:5432"
    volumes:
      - truesight-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truesight -d truesight"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  truesight-db:
