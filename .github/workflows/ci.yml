# Runs every test on every pull request, and again when something is merged into main.
# A pull request whose tests fail cannot be merged (once the main ruleset requires these checks).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # verify runs the quick tests, then the ones against a real PostgreSQL (GitHub's machines have Docker).
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the live site's Docker image, exactly as the deploy will, without publishing it. The image only copies part
  # of the repository, so something that passes the two jobs above can still fail here: better to find out before
  # merging than when the deploy fails.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build .
