# TrueSight's settings. Secrets never go in this file: they come from environment variables, or from a .env file in
# the repository root that Git ignores. See .env.example for the list.
spring:
  application:
    name: truesight
  # "local" is used unless something else is chosen. The live site sets SPRING_PROFILES_ACTIVE=prod, and tests use
  # "test". Only "local" and "test" create the demo user (see DemoUserSeeder).
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5530/truesight}
    username: ${DATABASE_USERNAME:truesight}
    password: ${DATABASE_PASSWORD:truesight}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the tables. Hibernate only checks that the Java classes match them, and refuses to start if
      # they do not. Never change this to update or create.
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Google Cloud Run tells the app which port to use through $PORT.
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# TrueSight's own settings, read by the stories that need them. The names match .env.example.
truesight:
  jwt-secret: ${JWT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  sec:
    user-agent: ${SEC_USER_AGENT:TrueSight contact@truesight.com}
