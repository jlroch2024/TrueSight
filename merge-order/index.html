<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrueSight Merge Order</title>
<meta name="description" content="Merge order and pull request status for each TrueSight sprint.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* The one address for every sprint's merge order: /merge-order/. build_site.py writes each sprint's page (the
   pages/sprint-N/index.html sources) into this file, and a tab bar shows the chosen one in a frame. Only the open sprint
   is running, so only it reads GitHub. The address after # remembers the tab, and the newest sprint opens by default. */
:root {
  color-scheme: dark;
  --bg: #07141a; --panel: #0c232b; --border: #2a4a53; --text: #eef8f5; --muted: #a6c2be; --accent: #2dd4bf;
  --font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; }
.bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 52px;
       background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.tabs { position: relative; display: flex; height: 100%; }
.tab { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 20px;
       height: 100%; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab small { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
@media (max-width: 560px) { .brand { display: none; } .tab { padding: 0 14px; } }
</style>
</head>
<body>
<nav class="bar" aria-label="Sprint">
  <span class="brand">TrueSight</span>
  <div class="tabs" role="tablist" id="tabs"></div>
</nav>
<iframe id="frame" title="Merge order"></iframe>
<script>
// Oldest first, so the last one is the latest and opens by default. A new sprint is a new pages/sprint-N/ folder.
const PAGES = {"sprint-3": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>TrueSight Sprint 3<\/title>\n<meta name=\"description\" content=\"Sprint 3 merge order and pull request status for TrueSight.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap\">\n<style>\n/* Layout: the app's blueprint sheet. A summary band (progress, team), then Sprint 3 as a left-to-right merge-order\n   flow. Each story is a raised tile showing its owner and its pull request's state, read live from GitHub's public\n   API by the visitor's browser. Deliberately one dark look, the same as TrueSight itself. */\n:root {\n  color-scheme: dark;\n  --bg: #07141a;\n  --panel: #0c232b;\n  --panel-top: #12313b;\n  --border: #2a4a53;\n  --border-strong: #3b636c;\n  --text: #eef8f5;\n  --muted: #a6c2be;\n  --faint: #6a8c8e;\n  --accent: #2dd4bf;\n  --lime: #c4f36a;\n  --amber: #f5b73b;\n  --danger: #ff7a7a;\n  --setup: #93b5ff;\n  --font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  color: var(--text);\n  background-color: var(--bg);\n  background-image: linear-gradient(rgb(45 212 191 / 3%) 1px, transparent 1px),\n    linear-gradient(90deg, rgb(45 212 191 / 3%) 1px, transparent 1px);\n  background-size: 32px 32px;\n  font-size: 16px;\n  line-height: 1.45;\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: inherit; }\n\n.page {\n  max-width: 1440px;\n  margin: 0 auto;\n  padding-block: 52px 64px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n  display: grid;\n  gap: 40px;\n}\n\n/* Header */\n.hero { display: grid; grid-template-columns: auto 1fr; gap: 8px 32px; align-items: end; }\n.sprint-num {\n  grid-row: span 3; font-size: clamp(88px, 11vw, 150px); line-height: .78; font-weight: 700; letter-spacing: -.05em;\n  color: transparent; -webkit-text-stroke: 2px var(--accent);\n}\n.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 600; font-size: 15px; letter-spacing: .03em; }\n.eyebrow svg { width: 22px; height: 22px; }\nh1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }\n.live { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; color: var(--muted); font-size: 15px; }\n.live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 8px; vertical-align: 1px; }\n.live.on .dot { background: var(--lime); box-shadow: 0 0 0 4px rgb(196 243 106 / 15%); animation: pulse 2s ease-in-out infinite; }\n.live.stale .dot { background: var(--amber); }\n.live button {\n  font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--border);\n  padding: 3px 10px; cursor: pointer;\n}\n.live button:hover:not(:disabled), .live button:focus-visible { color: var(--text); border-color: var(--border-strong); outline: none; }\n.live button:disabled { opacity: .5; cursor: default; }\n\n/* Summary band */\n.summary { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }\n.panel {\n  background: linear-gradient(180deg, var(--panel-top), var(--panel));\n  border: 1px solid var(--border);\n  box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%), 0 18px 40px -24px rgb(0 0 0 / 80%);\n  padding: 20px 22px;\n}\n.panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }\n.figures { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-bottom: 18px; }\n.figure b { display: block; font-size: 34px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }\n.figure b small { font-size: 18px; color: var(--muted); font-weight: 500; }\n.figure span { color: var(--muted); font-size: 14px; }\n.bar { display: flex; height: 12px; background: rgb(255 255 255 / 4%); border: 1px solid var(--border); overflow: hidden; }\n.bar i { display: block; height: 100%; transition: width .6s ease; }\n/* The bar moves: a light sweeps across what is merged, and stripes run through work still under way. */\n.bar .merged {\n  background: linear-gradient(100deg, var(--lime) 40%, #efffc8 50%, var(--lime) 60%) var(--lime);\n  background-size: 250% 100%; animation: sheen 3.6s ease-in-out infinite;\n}\n.bar .open {\n  background: linear-gradient(135deg, #5fe6d4 25%, var(--accent) 25% 50%, #5fe6d4 50% 75%, var(--accent) 75%);\n  background-size: 16px 16px; animation: stripes .9s linear infinite;\n}\n.bar .started {\n  background: linear-gradient(135deg, rgb(45 212 191 / 55%) 25%, rgb(45 212 191 / 22%) 25% 50%, rgb(45 212 191 / 55%) 50% 75%, rgb(45 212 191 / 22%) 75%);\n  background-size: 16px 16px; animation: stripes 1.8s linear infinite;\n}\n@keyframes stripes { to { background-position: 16px 0; } }\n.bar-key { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }\n.bar-key i { display: inline-block; width: 10px; height: 10px; margin-right: 7px; vertical-align: -1px; }\n.bar-key .merged { background: var(--lime); }\n.bar-key .open { background: var(--accent); }\n.bar-key .started { background: rgb(45 212 191 / 45%); }\n.bar-key .none { background: rgb(255 255 255 / 10%); }\n\n.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 8px; }\n.person {\n  display: flex; align-items: center; gap: 11px; padding: 9px 10px; min-width: 0; text-align: left;\n  background: rgb(7 20 26 / 55%); border: 1px solid var(--border); color: var(--text); font: inherit; cursor: pointer;\n  transition: border-color .15s, background .15s;\n}\n.person:hover, .person:focus-visible { border-color: var(--border-strong); background: rgb(7 20 26 / 85%); outline: none; }\n.person.on { border-color: var(--text); }\n/* A person: name and points on one line, a small bar of stories merged on the next. Nothing wraps. */\n.person .p-body { flex: 1; min-width: 0; display: grid; gap: 7px; }\n.person .p-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; }\n.person b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }\n.person .p-row span { flex: none; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }\n.person .p-row .mini { flex: 1; height: 5px; background: rgb(255 255 255 / 9%); overflow: hidden; }\n.person .mini i { display: block; height: 100%; background: var(--lime); }\n\n.avatar {\n  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;\n  font-size: 12px; font-weight: 700; color: #08161b; background: var(--c);\n  box-shadow: 0 0 0 2px rgb(7 20 26 / 90%), 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent);\n}\n.avatar.sm { width: 24px; height: 24px; font-size: 10.5px; }\n\n.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: 14px; align-items: center; }\n.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 8px; vertical-align: -1px; }\n.legend .line { width: 24px; height: 2px; vertical-align: 3px; }\n.legend .sep { width: 1px; height: 16px; background: var(--border); }\n\n/* Flow */\n.flow { position: relative; display: grid; grid-template-columns: 1fr 3fr 1fr 1fr; gap: 46px; align-items: start; }\n.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }\n/* Lines use the same colours as tile edges: plain edge, a merged tile's see-through lime, and the highlight colours. */\n.links path { fill: none; stroke: var(--border); stroke-width: 1.5; transition: opacity .2s, stroke .2s; }\n.links path.done { stroke: rgb(196 243 106 / 55%); }\n.links path.need { stroke: var(--accent); opacity: 1; stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }\n.links path.unlock { stroke: var(--lime); opacity: 1; stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }\n.links path.off { opacity: .05; }\n@keyframes flow { to { stroke-dashoffset: -11; } }\n@keyframes pulse { 50% { opacity: .35; } }\n\n.stage { position: relative; z-index: 1; display: grid; gap: 12px; align-content: start; min-width: 0; }\n.stage-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 9px; border-bottom: 1px solid var(--border-strong); }\n.stage-head b { font-size: 19px; font-weight: 600; }\n.stage-head span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }\n.cards { display: grid; gap: 12px; }\n.stage.wide .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n\n/* A story tile: raised, with the app's top-right chamfer cut by a corner piece so the shadow survives */\n.card {\n  --edge: var(--border);\n  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 13px 14px 13px; cursor: pointer; outline: none;\n  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel) 100%);\n  border: 1px solid var(--edge);\n  box-shadow: inset 0 1px 0 rgb(255 255 255 / 6%);\n  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);\n  transition: opacity .2s, border-color .2s, box-shadow .2s, transform .2s;\n}\n/* The corner is cut away (so lines behind show through it); this draws the cut's edge. */\n.card::before {\n  content: \"\"; position: absolute; top: -1px; right: -1px; width: 12px; height: 12px;\n  background: linear-gradient(225deg, transparent 0 50%, var(--edge) 50% calc(50% + var(--edge-w, 1.3px)), transparent calc(50% + var(--edge-w, 1.3px)));\n}\n/* The cut clips the tile's own shadows, so a wrapper draws them, following the cut shape. */\n.tile { display: flex; min-width: 0; filter: drop-shadow(0 8px 10px rgb(0 0 0 / 55%)); }\n.tile > .card { flex: 1; min-width: 0; }\n.tile:has(> .is-open), .tile:has(> .is-draft) {\n  filter: drop-shadow(0 8px 10px rgb(0 0 0 / 55%)) drop-shadow(0 4px 12px rgb(45 212 191 / 30%));\n}\n.lit .tile:has(> .need) { filter: drop-shadow(0 0 11px rgb(45 212 191 / 60%)); }\n.lit .tile:has(> .unlock) { filter: drop-shadow(0 0 11px rgb(196 243 106 / 55%)); }\n.tile:has(> .changed) { animation: glow 1.6s ease-out 2; }\n@keyframes glow { 35% { filter: drop-shadow(0 0 18px rgb(196 243 106 / 65%)); } }\n.card:hover, .card:focus-visible { transform: translateY(-2px); --edge: var(--border-strong); }\n.card:focus-visible { --edge: var(--text); }\n.card .top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }\n.card .kind { width: 9px; height: 9px; flex: none; }\n.card .pts {\n  margin-left: auto; margin-right: 6px; min-width: 25px; height: 23px; padding: 0 6px; display: grid; place-items: center;\n  background: rgb(7 20 26 / 60%); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 13px;\n}\n.card .name { font-size: 16px; font-weight: 600; line-height: 1.28; text-wrap: pretty; letter-spacing: -.005em; }\n/* Every tile has the same rows: key and points, a name in a fixed three-line space, owner, status (with an icon for\n   the pull request's checks), and what it still waits for. No row wraps. */\n.card .top, .card .who, .card .status, .card .detail { white-space: nowrap; }\n.card .top a { color: var(--muted); text-decoration: none; }\n.card .top a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }\n.card .name { height: calc(3 * 1.28em); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }\n.card .who { display: flex; align-items: center; gap: 8px; margin-top: auto; font-size: 14px; color: var(--muted); font-weight: 500; }\n.card .status, .card .detail { display: flex; gap: 6px; height: 25px; overflow: hidden; margin-top: -2px; }\n.card .checks { display: inline-flex; }\n.card .checks svg { width: 15px; height: 15px; }\n.card .checks.ok { color: var(--lime); }\n.card .checks.bad { color: var(--danger); }\n.card .checks.wait { color: var(--amber); }\n.chip {\n  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 13px; font-weight: 500;\n  border: 1px solid var(--border); color: var(--muted); background: rgb(7 20 26 / 50%); text-decoration: none; white-space: nowrap;\n}\na.chip:hover { border-color: var(--text); color: var(--text); }\n.chip svg { width: 13px; height: 13px; }\n.chip.started { color: var(--accent); border-color: rgb(45 212 191 / 40%); }\n.chip.open { color: #062019; background: var(--accent); border-color: var(--accent); font-weight: 600; }\n.chip.draft { color: var(--accent); border-color: rgb(45 212 191 / 55%); border-style: dashed; }\n.chip.merged { color: #11200a; background: var(--lime); border-color: var(--lime); font-weight: 600; }\n.chip.changes { color: #2a0a0a; background: var(--danger); border-color: var(--danger); font-weight: 600; }\n.chip.ok { color: var(--lime); border-color: rgb(196 243 106 / 50%); }\n.chip.wait { color: var(--amber); border-color: rgb(245 183 59 / 45%); }\n.chip.bad { color: var(--danger); border-color: rgb(255 122 122 / 50%); }\n\n.card.is-started { --edge: rgb(45 212 191 / 40%); }\n.card.is-open, .card.is-draft { --edge: rgb(45 212 191 / 75%); }\n.card.is-merged {\n  --edge: rgb(196 243 106 / 55%);\n  background: linear-gradient(180deg, #1d3a2a 0%, #132a22 100%);\n}\n.card.is-merged .name { color: #e9f8d6; }\n\n.kind-fix { background: var(--amber); }\n.kind-new { background: var(--accent); }\n.kind-setup { background: var(--setup); }\n.line.need { background: var(--accent); }\n.line.unlock { background: var(--lime); }\n\n/* Highlight: a story with what it needs and unlocks, or one person's stories */\n.lit .card { opacity: .2; }\n/* The thicker edge is drawn inside the tile, so the cut corner stays cut; the glow comes from the tile's wrapper. */\n.lit .card.sel, .lit .card.need, .lit .card.unlock { opacity: 1; --edge-w: 2px; box-shadow: inset 0 0 0 1px var(--edge); }\n.lit .card.sel { --edge: var(--text); }\n.lit .card.need { --edge: var(--accent); }\n.lit .card.unlock { --edge: var(--lime); }\n\n\n/* Motion: an opening sequence (header, panels, tiles step by step, then the curves draw), figures that count, pulses\n   running along every need that is already met, a spotlight under the pointer, a countdown to the next GitHub check,\n   and a flash plus a note when a story's status changes. */\n@keyframes rise { from { opacity: 0; transform: translateY(16px); } }\n@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }\n@keyframes sheen { 0%, 50% { background-position: 140% 0; } 100% { background-position: -40% 0; } }\n@keyframes flash {\n  0% { box-shadow: inset 0 0 0 0 rgb(196 243 106 / 0%), 0 0 0 0 rgb(196 243 106 / 0%); }\n  35% { box-shadow: inset 0 0 0 2px rgb(196 243 106 / 95%), 0 0 0 0 rgb(196 243 106 / 0%); }\n  100% { box-shadow: inset 0 0 0 0 rgb(196 243 106 / 0%), 0 0 0 0 rgb(196 243 106 / 0%); }\n}\n@keyframes spin { to { transform: rotate(360deg); } }\n@keyframes countdown { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes toast-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }\n\n.hero > *, .panel, .legend { animation: rise .7s cubic-bezier(.2, .7, .2, 1) backwards; }\n.eyebrow { animation-delay: 60ms; }\nh1 { animation-delay: 120ms; }\n.live { animation-delay: 180ms; }\n.summary .panel:first-child { animation-delay: 220ms; }\n.summary .panel + .panel { animation-delay: 300ms; }\n.legend { animation-delay: 360ms; }\n\n.card { animation: rise .6s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: var(--d, 0ms); }\n.settled .card { animation: none; }\n.card.changed, .settled .card.changed { --edge: var(--lime); --edge-w: 2px; animation: flash 1.6s ease-out 2; }\n.card::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;\n  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgb(45 212 191 / 13%), transparent 65%);\n}\n.card:hover::after { opacity: 1; }\n\n.links path.intro:not(.need):not(.unlock) { stroke-dasharray: var(--len); animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) both; animation-delay: var(--d, 0ms); }\n\n.chip.open {\n  background-image: linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 45%) 50%, transparent 65%);\n  background-size: 250% 100%; animation: sheen 3.2s ease-in-out infinite;\n}\n.chip.started svg { animation: pulse 1.6s ease-in-out infinite; }\n\n.figure b i { font-style: normal; }\n.figure b { transition: color .8s; }\n.figure.bump b { color: var(--lime); transition: none; }\n.bar i { width: 0; transition: width 1.2s cubic-bezier(.2, .7, .2, 1); }\n\n.live button { position: relative; display: inline-flex; align-items: center; gap: 7px; overflow: hidden; }\n.live button svg { width: 14px; height: 14px; }\n.live button.spinning svg { animation: spin .8s linear infinite; }\n.live button::after {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent);\n  opacity: .75; transform: scaleX(0); transform-origin: left;\n}\n.live button.counting::after { animation: countdown var(--every, 300s) linear forwards; }\n\n.toasts {\n  position: fixed; z-index: 20; display: grid; gap: 10px; width: min(380px, calc(100vw - 32px));\n  right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));\n}\n.toast {\n  display: flex; align-items: center; gap: 12px; padding: 13px 15px;\n  background: linear-gradient(180deg, var(--panel-top), var(--panel)); border: 1px solid var(--border-strong);\n  box-shadow: 0 20px 44px -14px rgb(0 0 0 / 90%); animation: toast-in .4s cubic-bezier(.2, .7, .2, 1) backwards;\n  transition: opacity .35s, transform .35s;\n}\n.toast.out { opacity: 0; transform: translateY(10px); }\n.toast div { min-width: 0; }\n.toast b { display: block; font-size: 15px; font-weight: 600; }\n.toast span { display: block; color: var(--muted); font-size: 14px; }\n.toast i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }\n\n/* Narrow screens: steps stack, curves give way to the highlight alone */\n@media (max-width: 1320px) {\n  .summary { grid-template-columns: 1fr; }\n  .flow { grid-template-columns: 1fr; gap: 30px; }\n  .links { display: none; }\n  .stage .cards, .stage.wide .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }\n}\n@media (max-width: 560px) {\n  .page { padding-block: 30px 44px; gap: 30px; }\n  .hero { grid-template-columns: 1fr; }\n  .sprint-num { grid-row: auto; font-size: 88px; }\n  .figure b { font-size: 28px; }\n  .panel { padding: 16px; }\n  .stage .cards, .stage.wide .cards { grid-template-columns: 1fr; }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition: none !important; }\n}\n<\/style>\n<\/head>\n<body>\n\n<main class=\"page\" id=\"page\">\n  <header class=\"hero\">\n    <div class=\"sprint-num\">3<\/div>\n    <div class=\"eyebrow\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"5\" cy=\"12\" r=\"2.5\"/><circle cx=\"19\" cy=\"5\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><path d=\"M7.3 11 16.7 6M7.3 13l9.4 5\"/><\/svg>\n      TrueSight \u00b7 Sprint 3\n    <\/div>\n    <h1>Recommend and Explain<\/h1>\n    <div class=\"live\" id=\"live\"><span><span class=\"dot\"><\/span><span id=\"live-text\">Reading GitHub<\/span><\/span><button type=\"button\" id=\"refresh\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M13.5 8a5.5 5.5 0 1 1-1.6-3.9\"/><path d=\"M13.5 2.5v3h-3\"/><\/svg>Refresh<\/button><\/div>\n  <\/header>\n\n  <section class=\"summary\">\n    <div class=\"panel\">\n      <h2>Progress<\/h2>\n      <div class=\"figures\" id=\"figures\"><\/div>\n      <div class=\"bar\" id=\"bar\"><i class=\"merged\"><\/i><i class=\"open\"><\/i><i class=\"started\"><\/i><\/div>\n      <div class=\"bar-key\" id=\"bar-key\"><\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Team<\/h2>\n      <div class=\"team\" id=\"team\"><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"legend\">\n    <span><i class=\"kind-fix\"><\/i>Fix<\/span>\n    <span><i class=\"kind-new\"><\/i>New<\/span>\n    <span><i class=\"kind-setup\"><\/i>Setup<\/span>\n    <span class=\"sep\"><\/span>\n    <span><i class=\"line need\"><\/i>Needs<\/span>\n    <span><i class=\"line unlock\"><\/i>Unlocks<\/span>\n  <\/div>\n\n  <div class=\"flow\" id=\"flow\"><svg class=\"links\" aria-hidden=\"true\"><\/svg><\/div>\n\n  <div class=\"toasts\" id=\"toasts\" aria-live=\"polite\"><\/div>\n<\/main>\n\n<script>\n// Team, keyed by Jira initials, with Jira's colours. Each icon shows the first name's initial (ZA for Zhe An).\nconst PEOPLE = {\n  JR: { name: 'Jeremy', init: 'J', c: '#3fbf86' },\n  ZY: { name: 'Zyik', init: 'Z', c: '#f4cf4f' },\n  LA: { name: 'Zhe An', init: 'ZA', c: '#f0814a' },\n  BY: { name: 'Ben', init: 'B', c: '#4f8ff7' },\n  AY: { name: 'Allan', init: 'A', c: '#9b7cf0' },\n  I: { name: 'Isaiah', init: 'I', c: '#f0627e' },\n};\n\n// Sprint 3 stories from Sprints-3-and-4-Plan.md and Jira: [number, key, name, kind, points, needs, assignee]\nconst STORIES = [\n  [1, 168, 'Show Dates and Labels the Same Way', 'fix', 3, [], 'ZY'],\n  [2, 169, \"Ask in TrueSight's Own Window\", 'fix', 3, [], 'ZY'],\n  [3, 170, 'Polish Log In and Sign Up', 'fix', 1, [], 'JR'],\n  [4, 171, 'A Flowing Supply Chain Graph', 'fix', 8, [], 'JR'],\n  [5, 172, 'Clearer Alerts', 'fix', 5, [], 'ZY'],\n  [6, 173, 'Easier Review', 'fix', 2, [1], 'LA'],\n  [7, 174, 'Group Alerts About One Event', 'new', 5, [5], 'AY'],\n  [8, 175, 'Sharper Noise Filter', 'new', 3, [], 'BY'],\n  [9, 176, 'Spell Each Company as Its Own Report Does', 'fix', 8, [5], 'LA'],\n  [10, 177, 'Say When Something Fails', 'fix', 3, [2], 'BY'],\n  [11, 178, 'One Workspace', 'new', 8, [2, 4, 5, 10, 14], 'JR'],\n  [12, 179, 'Faster Analyse and Check News', 'new', 5, [15], 'AY'],\n  [13, 180, 'Name Companies the Way People Know Them', 'fix', 8, [15], 'I'],\n  [14, 181, 'Alerts Are the One Source of News', 'fix', 5, [5], 'I'],\n  [15, 182, 'Set Up Sprint 3', 'setup', 5, [], 'ZY'],\n  [16, 183, 'Get a Recommendation', 'new', 8, [15, 5], 'AY'],\n  [17, 184, 'Confirm or Overrule an Event', 'new', 5, [15], 'ZY'],\n  [18, 185, 'Fix or Add a Relationship', 'new', 5, [15], 'BY'],\n  [19, 186, 'How Critical Each Supplier Is', 'new', 5, [15], 'AY'],\n  [20, 187, 'Two Steps Along the Graph', 'new', 3, [15, 5], 'BY'],\n  [21, 188, 'See How Confident TrueSight Is', 'new', 5, [15, 22], 'LA'],\n  [22, 189, 'Second AI Checks the First', 'new', 5, [15], 'I'],\n  [23, 190, 'AI Audit Trail', 'new', 5, [15], 'BY'],\n  [24, 191, 'AI Quality Dashboard', 'new', 5, [16, 17, 22], 'LA'],\n  [25, 192, 'Edit My Profile', 'new', 3, [15], 'I'],\n  [26, 193, 'Edit or Remove Holdings', 'new', 3, [2], 'I'],\n].map(([n, key, name, kind, pts, needs, who]) => ({ n, key: 'TS-' + key, name, kind, pts, needs, who }));\nconst BY_N = Object.fromEntries(STORIES.map(s => [s.n, s]));\n\n// Merge order from the plan: each step merges once what it needs has.\nconst STAGES = [\n  { label: 'First', ids: [15, 1, 2, 3, 5, 4] },\n  { label: 'Then', wide: true, ids: [6, 10, 26, 7, 9, 14, 16, 20, 25, 17, 18, 22, 19, 23, 13, 12, 8] },\n  { label: 'Next', ids: [21, 24] },\n  { label: 'Last', ids: [11] },\n];\n\nconst ICON = {\n  lock: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"3.5\" y=\"7\" width=\"9\" height=\"6.5\"/><path d=\"M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7\"/><\/svg>',\n  check: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"m3 8.5 3.2 3L13 4.5\"/><\/svg>',\n  cross: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"m4 4 8 8M12 4l-8 8\"/><\/svg>',\n  clock: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"8\" cy=\"8\" r=\"5.5\"/><path d=\"M8 5v3.2l2 1.3\"/><\/svg>',\n  branch: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"4.5\" cy=\"3.5\" r=\"1.6\"/><circle cx=\"4.5\" cy=\"12.5\" r=\"1.6\"/><circle cx=\"11.5\" cy=\"5.5\" r=\"1.6\"/><path d=\"M4.5 5.1v5.8M11.5 7.1c0 2.4-2 3-7 4\"/><\/svg>',\n};\n\n// Live state, read from GitHub. States: merged, approved, changes (changes requested), review (waiting for review),\n// draft, branch (pushed, no pull request yet) and none.\nlet STATUS = {};\nlet checkedAt = null;\nlet liveError = null;\nconst CARD_LOOK = { branch: 'started', review: 'open', approved: 'open', changes: 'open' };\nconst stateOf = s => (STATUS[s.key] && STATUS[s.key].state) || 'none';\nconst isMerged = n => stateOf(BY_N[n]) === 'merged';\n\nconst flow = document.getElementById('flow');\nconst page = document.getElementById('page');\nconst MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst OPENED = performance.now();\nsetTimeout(() => page.classList.add('settled'), 2600);\nconst LABEL = {\n  merged: 'Merged', approved: 'Approved', changes: 'Changes Requested', review: 'Waiting for Review',\n  draft: 'Draft Pull Request', branch: 'In Progress', none: 'Not Started',\n};\n\n// Figures count from what they last showed to their new value, and glow lime when they rise after the first load.\nconst shownFigures = [];\nfunction showFigures(list) {\n  const box = document.getElementById('figures');\n  if (!box.children.length) {\n    box.innerHTML = list.map(([, of, label]) =>\n      `<div class=\"figure\"><b><i>0<\/i>${of != null ? `<small> / ${of}<\/small>` : ''}<\/b><span>${label}<\/span><\/div>`).join('');\n  }\n  list.forEach(([to], i) => {\n    const from = shownFigures[i] ?? 0;\n    shownFigures[i] = to;\n    const fig = box.children[i];\n    const num = fig.querySelector('i');\n    if (from === to) { num.textContent = to; return; }\n    if (to > from && checkedAt && performance.now() - OPENED > 3000) {\n      fig.classList.add('bump');\n      setTimeout(() => fig.classList.remove('bump'), 900);\n    }\n    if (!MOTION) { num.textContent = to; return; }\n    const start = performance.now(), wait = performance.now() - OPENED < 1000 ? 250 : 0;\n    const step = now => {\n      const t = Math.min(1, Math.max(0, (now - start - wait) / 900));\n      num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));\n      if (t < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  });\n}\n\n// A story whose status changed since the last check (or since this browser's last visit) flashes and gets a note.\nfunction announce(changed) {\n  const box = document.getElementById('toasts');\n  changed.slice(0, 4).forEach((s, i) => {\n    const card = flow.querySelector(`.card[data-id=\"${s.n}\"]`);\n    card.classList.remove('changed');\n    void card.offsetWidth;\n    card.classList.add('changed');\n    setTimeout(() => card.classList.remove('changed'), 3400);\n\n    const state = stateOf(s);\n    let note = `Now ${LABEL[state]}`;\n    if (state === 'merged') {\n      const free = STORIES.filter(x => x.needs.includes(s.n) && x.needs.every(isMerged)).length;\n      note = free ? `Merged \u00b7 Unblocks ${free} ${free === 1 ? 'Story' : 'Stories'}` : 'Merged';\n    }\n    const toast = document.createElement('div');\n    toast.className = 'toast';\n    toast.style.animationDelay = `${i * 120}ms`;\n    toast.innerHTML = `<i style=\"--c:${state === 'merged' ? 'var(--lime)' : 'var(--accent)'}\"><\/i><div><b>${s.key} ${s.name}<\/b><span>${note}<\/span><\/div>`;\n    box.appendChild(toast);\n    setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 400); }, 7000 + i * 400);\n  });\n}\n\nfunction avatar(code, sm) {\n  const p = PEOPLE[code];\n  return `<span class=\"avatar${sm ? ' sm' : ''}\" style=\"--c:${p.c}\" aria-hidden=\"true\">${p.init}<\/span>`;\n}\n\nfunction buildCards() {\n  for (const stage of STAGES) {\n    const col = document.createElement('div');\n    col.className = 'stage' + (stage.wide ? ' wide' : '');\n    col.innerHTML = `<div class=\"stage-head\"><b>${stage.label}<\/b><span data-stage><\/span><\/div><div class=\"cards\"><\/div>`;\n    const cards = col.querySelector('.cards');\n    for (const n of stage.ids) {\n      const s = BY_N[n];\n      const el = document.createElement('div');\n      el.className = 'card';\n      el.style.setProperty('--d', `${380 + STAGES.indexOf(stage) * 170 + stage.ids.indexOf(n) * 28}ms`);\n      el.dataset.id = n;\n      el.tabIndex = 0;\n      el.setAttribute('role', 'button');\n      el.innerHTML = `<div class=\"top\"><span class=\"kind kind-${s.kind}\"><\/span>${s.key}<span data-pr><\/span><span data-checks><\/span><span class=\"pts\" title=\"Story points\">${s.pts}<\/span><\/div>\n        <div class=\"name\" title=\"${s.name}\">${s.name}<\/div>\n        <div class=\"who\">${avatar(s.who, true)}${PEOPLE[s.who].name}<\/div>\n        <div class=\"status\" data-chip><\/div>\n        <div class=\"detail\" data-detail><\/div>`;\n      const tile = document.createElement('div');\n      tile.className = 'tile';\n      tile.appendChild(el);\n      cards.appendChild(tile);\n    }\n    flow.appendChild(col);\n  }\n}\n\nconst title = t => t.replace(/\\b\\w/g, c => c.toUpperCase());\nfunction ago(iso) {\n  const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));\n  if (mins < 1) return 'Just Now';\n  if (mins < 60) return `${mins} Minute${mins === 1 ? '' : 's'} Ago`;\n  const h = Math.round(mins / 60);\n  if (h < 48) return `${h} Hour${h === 1 ? '' : 's'} Ago`;\n  return `${Math.round(h / 24)} Days Ago`;\n}\n\nfunction render() {\n  STAGES.forEach((stage, i) => {\n    const stories = stage.ids.map(n => BY_N[n]);\n    const done = stories.filter(s => stateOf(s) === 'merged').length;\n    flow.querySelectorAll('[data-stage]')[i].textContent =\n      `${done} of ${stories.length} Merged \u00b7 ${stories.reduce((t, s) => t + s.pts, 0)} Points`;\n  });\n\n  for (const el of flow.querySelectorAll('.card')) {\n    const s = BY_N[+el.dataset.id];\n    const st = STATUS[s.key] || {};\n    const state = stateOf(s);\n    el.className = el.className.replace(/\\bis-\\w+/g, '').trim() + ' is-' + (CARD_LOOK[state] || state);\n    const prLink = (cls, label) => `<a class=\"chip ${cls}\" href=\"${st.url}\" target=\"_blank\" rel=\"noopener\" title=\"Open pull request #${st.pr}\">${label}<\/a>`;\n    let chip = '';\n    if (state === 'merged') chip = prLink('merged', ICON.check + 'Merged');\n    else if (state === 'approved') chip = prLink('open', ICON.check + 'Approved');\n    else if (state === 'changes') chip = prLink('changes', 'Changes Requested');\n    else if (state === 'review') chip = prLink('open', 'Waiting for Review');\n    else if (state === 'draft') chip = prLink('draft', 'Draft');\n    else if (state === 'branch') chip = `<span class=\"chip started\" title=\"A branch for this story is on GitHub\">${ICON.branch}In Progress<\/span>`;\n    else chip = `<span class=\"chip\">Not Started<\/span>`;\n    el.querySelector('[data-chip]').innerHTML = chip;\n\n    const inPR = CARD_LOOK[state] === 'open' || state === 'draft';\n    el.querySelector('[data-pr]').innerHTML = st.pr\n      ? ` \u00b7 <a href=\"${st.url}\" target=\"_blank\" rel=\"noopener\" title=\"Open pull request #${st.pr}\">#${st.pr}<\/a>` : '';\n    const checks = inPR && { pass: ['ok', ICON.check, 'Checks pass'], fail: ['bad', ICON.cross, 'Checks fail'], pending: ['wait', ICON.clock, 'Checks running'] }[st.checks];\n    el.querySelector('[data-checks]').innerHTML = checks\n      ? `<span class=\"checks ${checks[0]}\" title=\"${checks[2]}\" aria-label=\"${checks[2]}\">${checks[1]}<\/span>` : '';\n    // What the story still waits for: amber once its pull request is open, quiet before that.\n    const waiting = s.needs.filter(n => !isMerged(n)).map(n => BY_N[n].key);\n    let detail = '';\n    if (state !== 'merged' && waiting.length) {\n      const what = waiting.length === 1 ? waiting[0] : `${waiting.length} Stories`;\n      detail = `<span class=\"chip${inPR ? ' wait' : ''}\" title=\"Waits for ${waiting.join(', ')}\">${ICON.lock}Waits for ${what}<\/span>`;\n    } else if (state === 'approved' && st.checks !== 'fail') {\n      detail = `<span class=\"chip ok\">${ICON.check}Ready to Merge<\/span>`;\n    }\n    el.querySelector('[data-detail]').innerHTML = detail;\n    el.setAttribute('aria-label', `${s.key} ${s.name}, ${s.pts} points, ${PEOPLE[s.who].name}, ${el.querySelector('[data-chip]').textContent}`);\n  }\n\n  // Progress\n  const total = STORIES.reduce((t, s) => t + s.pts, 0);\n  const groups = { merged: [], open: [], started: [], none: [] };\n  STORIES.forEach(s => groups[{ draft: 'open', branch: 'started' }[stateOf(s)] || CARD_LOOK[stateOf(s)] || stateOf(s)].push(s));\n  const pts = list => list.reduce((t, s) => t + s.pts, 0);\n  const count = state => STORIES.filter(s => stateOf(s) === state).length;\n  showFigures([\n    [groups.merged.length, STORIES.length, 'Stories Merged'],\n    [pts(groups.merged), total, 'Points Merged'],\n    [count('review') + count('changes'), null, 'Waiting for Review'],\n    [count('approved'), null, 'Approved'],\n    [groups.started.length, null, 'In Progress'],\n  ]);\n  const bars = document.querySelectorAll('#bar i');\n  const widths = ['merged', 'open', 'started'].map(k => (pts(groups[k]) / total * 100) + '%');\n  requestAnimationFrame(() => requestAnimationFrame(() => bars.forEach((b, i) => { b.style.width = widths[i]; })));\n  document.getElementById('bar-key').innerHTML = [\n    ['merged', 'Merged'], ['open', 'Pull Request Open'], ['started', 'In Progress'], ['none', 'Not Started'],\n  ].map(([k, l]) => `<span><i class=\"${k}\"><\/i>${l} \u00b7 ${pts(groups[k])} Points<\/span>`).join('');\n\n  // Team\n  document.getElementById('team').innerHTML = Object.entries(PEOPLE).map(([code, p]) => {\n    const mine = STORIES.filter(s => s.who === code);\n    const done = mine.filter(s => stateOf(s) === 'merged').length;\n    return `<button type=\"button\" class=\"person${person === code ? ' on' : ''}\" data-person=\"${code}\"\n      title=\"${p.name}: ${done} of ${mine.length} stories merged, ${pts(mine)} points\">${avatar(code)}\n      <div class=\"p-body\"><div class=\"p-row\"><b>${p.name}<\/b><span>${pts(mine)} Pts<\/span><\/div>\n      <div class=\"p-row\"><span class=\"mini\"><i style=\"width:${done / mine.length * 100}%\"><\/i><\/span><span>${done} of ${mine.length}<\/span><\/div><\/div><\/button>`;\n  }).join('');\n\n  // Live line\n  const live = document.getElementById('live');\n  const text = document.getElementById('live-text');\n  if (liveError) {\n    live.className = 'live stale';\n    text.textContent = liveError + (checkedAt ? ` Showing the status from ${ago(checkedAt).toLowerCase()}.` : ' Try Refresh in a minute.');\n  } else if (checkedAt) {\n    live.className = 'live on';\n    text.textContent = `Updated From GitHub ${ago(checkedAt)}`;\n  }\n\n  layout();\n}\n\n// Every tile takes the height of the tallest, so rows line up across all four steps.\nfunction levelCards() {\n  const cards = [...flow.querySelectorAll('.card')];\n  cards.forEach(c => { c.style.minHeight = ''; });\n  const tallest = Math.max(...cards.map(c => c.offsetHeight));\n  cards.forEach(c => { c.style.minHeight = tallest + 'px'; });\n}\n\nfunction layout() {\n  levelCards();\n  drawLinks();\n}\n\n// One straight line per \"needs\", from the centre of what is needed to the centre of what needs it, behind the tiles.\nfunction drawLinks() {\n  const svg = flow.querySelector('.links');\n  if (getComputedStyle(svg).display === 'none') return;\n  const box = flow.getBoundingClientRect();\n  const at = n => flow.querySelector(`.card[data-id=\"${n}\"]`);\n  let out = '';\n  for (const s of STORIES) {\n    const b = at(s.n);\n    for (const need of s.needs) {\n      const a = at(need);\n      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();\n      const x1 = ra.left + ra.width / 2 - box.left, y1 = ra.top + ra.height / 2 - box.top;\n      const x2 = rb.left + rb.width / 2 - box.left, y2 = rb.top + rb.height / 2 - box.top;\n      if (x2 <= x1) continue;\n      const d = `M${x1},${y1} L${x2},${y2}`;\n      out += `<path class=\"${isMerged(need) ? 'done' : ''}\" data-from=\"${need}\" data-to=\"${s.n}\" d=\"${d}\"/>`;\n    }\n  }\n  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);\n  svg.innerHTML = out;\n  // During the opening sequence the curves draw themselves in once the tiles have arrived.\n  const since = performance.now() - OPENED;\n  if (MOTION && since < 2000) {\n    svg.querySelectorAll('path').forEach((p, i) => {\n      p.style.setProperty('--len', p.getTotalLength());\n      p.style.setProperty('--d', `${1050 + i * 18 - since}ms`);\n      p.classList.add('intro');\n    });\n  }\n  applyHighlight();\n}\n\n// Highlight: one story (what it needs and unlocks) or one person's stories.\nlet selected = null, hovered = null, person = null;\nfunction applyHighlight() {\n  const n = hovered ?? selected;\n  const cards = flow.querySelectorAll('.card');\n  const paths = flow.querySelectorAll('.links path');\n  if (n == null && !person) {\n    page.classList.remove('lit');\n    cards.forEach(c => c.classList.remove( }\n\n.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: 14px; align-items: center; }\n.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 8px; vertical-align: -1px; }\n.legend .line { width: 24px; height: 2px; vertical-align: 3px; }\n.legend .sep { width: 1px; height: 16px; background: var(--border); }\n\n/* Flow */\n.flow { position: relative; display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 46px; align-items: start; }\n.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }\n/* Lines use the same colours as tile edges: plain edge, a merged tile's see-through lime, and the highlight colours. */\n.links path { fill: none; stroke: var(--border); stroke-width: 1.5; transition: opacity .2s, stroke .2s; }\n.links path.done { stroke: rgb(196 243 106 / 55%); }\n.links path.need { stroke: var(--accent); opacity: 1; stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }\n.links path.unlock { stroke: var(--lime); opacity: 1; stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }\n.links path.off { opacity: .05; }\n@keyframes flow { to { stroke-dashoffset: -11; } }\n@keyframes pulse { 50% { opacity: .35; } }\n\n.stage { position: relative; z-index: 1; display: grid; gap: 12px; align-content: start; min-width: 0; }\n.stage-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 9px; border-bottom: 1px solid var(--border-strong); }\n.stage-head b { font-size: 19px; font-weight: 600; }\n.stage-head span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }\n.cards { display: grid; gap: 12px; }\n.stage.wide .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n\n/* A story tile: raised, with the app's top-right chamfer cut by a corner piece so the shadow survives */\n.card {\n  --edge: var(--border);\n  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 13px 14px 13px; cursor: pointer; outline: none;\n  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel) 100%);\n  border: 1px solid var(--edge);\n  box-shadow: inset 0 1px 0 rgb(255 255 255 / 6%);\n  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);\n  transition: opacity .2s, border-color .2s, box-shadow .2s, transform .2s;\n}\n/* The corner is cut away (so lines behind show through it); this draws the cut's edge. */\n.card::before {\n  content: \"\"; position: absolute; top: -1px; right: -1px; width: 12px; height: 12px;\n  background: linear-gradient(225deg, transparent 0 50%, var(--edge) 50% calc(50% + var(--edge-w, 1.3px)), transparent calc(50% + var(--edge-w, 1.3px)));\n}\n/* The cut clips the tile's own shadows, so a wrapper draws them, following the cut shape. */\n.tile { display: flex; min-width: 0; filter: drop-shadow(0 8px 10px rgb(0 0 0 / 55%)); }\n.tile > .card { flex: 1; min-width: 0; }\n.tile:has(> .is-open), .tile:has(> .is-draft) {\n  filter: drop-shadow(0 8px 10px rgb(0 0 0 / 55%)) drop-shadow(0 4px 12px rgb(45 212 191 / 30%));\n}\n.lit .tile:has(> .need) { filter: drop-shadow(0 0 11px rgb(45 212 191 / 60%)); }\n.lit .tile:has(> .unlock) { filter: drop-shadow(0 0 11px rgb(196 243 106 / 55%)); }\n.tile:has(> .changed) { animation: glow 1.6s ease-out 2; }\n@keyframes glow { 35% { filter: drop-shadow(0 0 18px rgb(196 243 106 / 65%)); } }\n.card:hover, .card:focus-visible { transform: translateY(-2px); --edge: var(--border-strong); }\n.card:focus-visible { --edge: var(--text); }\n.card .top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }\n.card .kind { width: 9px; height: 9px; flex: none; }\n.card .pts {\n  margin-left: auto; margin-right: 6px; min-width: 25px; height: 23px; padding: 0 6px; display: grid; place-items: center;\n  background: rgb(7 20 26 / 60%); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 13px;\n}\n.card .name { font-size: 16px; font-weight: 600; line-height: 1.28; text-wrap: pretty; letter-spacing: -.005em; }\n/* Every tile has the same rows: key and points, a name in a fixed three-line space, owner, status (with an icon for\n   the pull request's checks), and what it still waits for. No row wraps. */\n.card .top, .card .who, .card .status, .card .detail { white-space: nowrap; }\n.card .top a { color: var(--muted); text-decoration: none; }\n.card .top a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }\n.card .name { height: calc(3 * 1.28em); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }\n.card .who { display: flex; align-items: center; gap: 8px; margin-top: auto; font-size: 14px; color: var(--muted); font-weight: 500; }\n.card .status, .card .detail { display: flex; gap: 6px; height: 25px; overflow: hidden; margin-top: -2px; }\n.card .checks { display: inline-flex; }\n.card .checks svg { width: 15px; height: 15px; }\n.card .checks.ok { color: var(--lime); }\n.card .checks.bad { color: var(--danger); }\n.card .checks.wait { color: var(--amber); }\n.chip {\n  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 13px; font-weight: 500;\n  border: 1px solid var(--border); color: var(--muted); background: rgb(7 20 26 / 50%); text-decoration: none; white-space: nowrap;\n}\na.chip:hover { border-color: var(--text); color: var(--text); }\n.chip svg { width: 13px; height: 13px; }\n.chip.started { color: var(--accent); border-color: rgb(45 212 191 / 40%); }\n.chip.open { color: #062019; background: var(--accent); border-color: var(--accent); font-weight: 600; }\n.chip.draft { color: var(--accent); border-color: rgb(45 212 191 / 55%); border-style: dashed; }\n.chip.merged { color: #11200a; background: var(--lime); border-color: var(--lime); font-weight: 600; }\n.chip.changes { color: #2a0a0a; background: var(--danger); border-color: var(--danger); font-weight: 600; }\n.chip.ok { color: var(--lime); border-color: rgb(196 243 106 / 50%); }\n.chip.wait { color: var(--amber); border-color: rgb(245 183 59 / 45%); }\n.chip.bad { color: var(--danger); border-color: rgb(255 122 122 / 50%); }\n\n.card.is-started { --edge: rgb(45 212 191 / 40%); }\n.card.is-open, .card.is-draft { --edge: rgb(45 212 191 / 75%); }\n.card.is-merged {\n  --edge: rgb(196 243 106 / 55%);\n  background: linear-gradient(180deg, #1d3a2a 0%, #132a22 100%);\n}\n.card.is-merged .name { color: #e9f8d6; }\n\n.kind-fix { background: var(--amber); }\n.kind-new { background: var(--accent); }\n.kind-setup { background: var(--setup); }\n.line.need { background: var(--accent); }\n.line.unlock { background: var(--lime); }\n\n/* Highlight: a story with what it needs and unlocks, or one person's stories */\n.lit .card { opacity: .2; }\n/* The thicker edge is drawn inside the tile, so the cut corner stays cut; the glow comes from the tile's wrapper. */\n.lit .card.sel, .lit .card.need, .lit .card.unlock { opacity: 1; --edge-w: 2px; box-shadow: inset 0 0 0 1px var(--edge); }\n.lit .card.sel { --edge: var(--text); }\n.lit .card.need { --edge: var(--accent); }\n.lit .card.unlock { --edge: var(--lime); }\n\n\n/* Motion: an opening sequence (header, panels, tiles step by step, then the curves draw), figures that count, pulses\n   running along every need that is already met, a spotlight under the pointer, a countdown to the next GitHub check,\n   and a flash plus a note when a story's status changes. */\n@keyframes rise { from { opacity: 0; transform: translateY(16px); } }\n@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }\n@keyframes sheen { 0%, 50% { background-position: 140% 0; } 100% { background-position: -40% 0; } }\n@keyframes flash {\n  0% { box-shadow: inset 0 0 0 0 rgb(196 243 106 / 0%), 0 0 0 0 rgb(196 243 106 / 0%); }\n  35% { box-shadow: inset 0 0 0 2px rgb(196 243 106 / 95%), 0 0 0 0 rgb(196 243 106 / 0%); }\n  100% { box-shadow: inset 0 0 0 0 rgb(196 243 106 / 0%), 0 0 0 0 rgb(196 243 106 / 0%); }\n}\n@keyframes spin { to { transform: rotate(360deg); } }\n@keyframes countdown { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes toast-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }\n\n.hero > *, .panel, .legend { animation: rise .7s cubic-bezier(.2, .7, .2, 1) backwards; }\n.eyebrow { animation-delay: 60ms; }\nh1 { animation-delay: 120ms; }\n.live { animation-delay: 180ms; }\n.summary .panel:first-child { animation-delay: 220ms; }\n.summary .panel + .panel { animation-delay: 300ms; }\n.legend { animation-delay: 360ms; }\n\n.card { animation: rise .6s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: var(--d, 0ms); }\n.settled .card { animation: none; }\n.card.changed, .settled .card.changed { --edge: var(--lime); --edge-w: 2px; animation: flash 1.6s ease-out 2; }\n.card::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;\n  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgb(45 212 191 / 13%), transparent 65%);\n}\n.card:hover::after { opacity: 1; }\n\n.links path.intro:not(.need):not(.unlock) { stroke-dasharray: var(--len); animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) both; animation-delay: var(--d, 0ms); }\n\n.chip.open {\n  background-image: linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 45%) 50%, transparent 65%);\n  background-size: 250% 100%; animation: sheen 3.2s ease-in-out infinite;\n}\n.chip.started svg { animation: pulse 1.6s ease-in-out infinite; }\n\n.figure b i { font-style: normal; }\n.figure b { transition: color .8s; }\n.figure.bump b { color: var(--lime); transition: none; }\n.bar i { width: 0; transition: width 1.2s cubic-bezier(.2, .7, .2, 1); }\n\n.live button { position: relative; display: inline-flex; align-items: center; gap: n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition: none !important; }\n}\n<\/style>\n<\/head>\n<body>\n\n<main class=\"page\" id=\"page\">\n  <header class=\"hero\">\n    <div class=\"sprint-num\">4<\/div>\n    <div class=\"eyebrow\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"5\" cy=\"12\" r=\"2.5\"/><circle cx=\"19\" cy=\"5\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><path d=\"M7.3 11 16.7 6M7.3 13l9.4 5\"/><\/svg>\n      TrueSight \u00b7 Sprint 4\n    <\/div>\n    <h1>Simulate and Look Back<\/h1>\n    <div class=\"live\" id=\"live\"><span><span class=\"dot\"><\/span><span id=\"live-text\">Reading GitHub<\/span><\/span><button type=\"button\" id=\"refresh\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M13.5 8a5.5 5.5 0 1 1-1.6-3.9\"/><path d=\"M13.5 2.5v3h-3\"/><\/svg>Refresh<\/button><\/div>\n  <\/header>\n\n  <section class=\"summary\">\n    <div class=\"panel\">\n      <h2>Progress<\/h2>\n      <div class=\"figures\" id=\"figures\"><\/div>\n      <div class=\"bar\" id=\"bar\"><i class=\"merged\"><\/i><i class=\"open\"><\/i><i class=\"started\"><\/i><\/div>\n      <div class=\"bar-key\" id=\"bar-key\"><\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Team<\/h2>\n      <div class=\"team\" id=\"team\"><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"legend\">\n    <span><i class=\"kind-fix\"><\/i>Fix<\/span>\n    <span><i class=\"kind-new\"><\/i>New<\/span>\n    <span><i class=\"kind-setup\"><\/i>Setup<\/span>\n    <span class=\"sep\"><\/span>\n    <span><i class=\"line need\"><\/i>Needs<\/span>\n    <span><i class=\"line unlock\"><\/i>Unlocks<\/span>\n  <\/div>\n\n  <div class=\"flow\" id=\"flow\"><svg class=\"links\" aria-hidden=\"true\"><\/svg><\/div>\n\n  <div class=\"toasts\" id=\"toasts\" aria-live=\"polite\"><\/div>\n<\/main>\n\n<script>\n// Team, keyed by Jira initials, with Jira's colours. Each icon shows the first name's initial (ZA for Zhe An).\nconst PEOPLE = {\n  JR: { name: 'Jeremy', init: 'J', c: '#3fbf86' },\n  ZY: { name: 'Zyik', init: 'Z', c: '#f4cf4f' },\n  LA: { name: 'Zhe An', init: 'ZA', c: '#f0814a' },\n  BY: { name: 'Ben', init: 'B', c: '#4f8ff7' },\n  AY: { name: 'Allan', init: 'A', c: '#9b7cf0' },\n  I: { name: 'Isaiah', init: 'I', c: '#f0627e' },\n};\n// A story with no assignee yet.\nconst NOBODY = 'NONE';\nconst UNASSIGNED = { name: 'Unassigned', init: '?', c: '#6a8c8e' };\nconst personOf = code => PEOPLE[code] || UNASSIGNED;\n\n// Sprint 4 stories from Sprint-4-Stories.md and Jira: [number, key, name, kind, points, needs, assignee]. Needs are the\n// Sprint 4 stories each one waits for (its Sprint 3 needs are all merged). Assignees are from Jira.\nconst STORIES = [\n  [27, 206, 'Set Up Sprint 4', 'setup', 2, [], 'I'],\n  [28, 207, 'Disruption Simulator', 'new', 5, [27], 'I'],\n  [30, 208, 'SEC Filing Timeline', 'new', 5, [27], 'I'],\n  [31, 209, 'Ask TrueSight', 'new', 8, [27], 'BY'],\n  [32, 210, 'Executive Briefing PDF', 'new', 5, [], 'BY'],\n  [33, 211, 'Get News Automatically', 'new', 3, [], 'AY'],\n  [34, 212, 'Scrub the Graph Through the Years', 'new', 5, [30, 28], 'JR'],\n  [35, 213, 'Measure Test Coverage', 'new', 2, [], 'AY'],\n  [36, 214, 'One Suggestion per Event', 'fix', 3, [], 'AY'],\n  [37, 215, 'Highlight What Matters in a Quote', 'new', 5, [27], 'LA'],\n  [38, 216, 'One Workspace on a Phone', 'new', 5, [], 'JR'],\n  [39, 217, \"Read Each Supplier's Own Report\", 'new', 8, [27], 'LA'],\n  [40, 218, 'Holdings in Order of Weight', 'new', 1, [], 'AY'],\n  [41, 219, 'Readable Supplier and Customer Counts', 'new', 2, [], 'AY'],\n  [42, 220, 'The Right Logo for Every Company', 'new', 3, [], 'ZY'],\n  [43, 221, 'Alerts From SEC 8-K Filings', 'new', 8, [], 'ZY'],\n  [44, 222, 'Grow the Graph as Results Arrive', 'new', 3, [], 'JR'],\n  [45, 223, 'Shorter Waits for Analyse and isMerged = n => stateOf(BY_N[n]) === 'merged';\n\nconst flow = document.getElementById('flow');\nconst page = document.getElementById('page');\nconst MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst OPENED = performance.now();\nsetTimeout(() => page.classList.add('settled'), 2600);\nconst LABEL = {\n  merged: 'Merged', approved: 'Approved', changes: 'Changes Requested', review: 'Waiting for Review',\n  draft: 'Draft Pull Request', branch: 'In Progress', none: 'Not Started',\n};\n\n// Figures count from what they last showed to their new value, and glow lime when they rise after the first load.\nconst shownFigures = [];\nfunction showFigures(list) {\n  const box = document.getElementById('figures');\n  if (!box.children.length) {\n    box.innerHTML = list.map(([, of, label]) =>\n      `<div class=\"figure\"><b><i>0<\/i>${of != null ? `<small> / ${of}<\/small>` : ''}<\/b><span>${label}<\/span><\/div>`).join('');\n  }\n  list.forEach(([to], i) => {\n    const from = shownFigures[i] ?? 0;\n    shownFigures[i] = to;\n    const fig = box.children[i];\n    const num = fig.querySelector('i');\n    if (from === to) { num.textContent = to; return; }\n    if (to > from && checkedAt && performance.now() - OPENED > 3000) {\n      fig.classList.add('bump');\n      setTimeout(() => fig.classList.remove('bump'), 900);\n    }\n    if (!MOTION) { num.textContent = to; return; }\n    const start = performance.now(), wait = performance.now() - OPENED < 1000 ? 250 : 0;\n    const step = now => {\n      const t = Math.min(1, Math.max(0, (now - start - wait) / 900));\n      num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));\n      if (t < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  });\n}\n\n// A story whose status changed since the last check (or since this browser's last visit) flashes and gets a note.\nfunction announce(changed) {\n  const box = document.getElementById('toasts');\n  changed.slice(0, 4).forEach((s, i) => {\n    const card = flow.querySelector(`.card[data-id=\"${s.n}\"]`);\n    card.classList.remove('changed');\n    void card.offsetWidth;\n    card.classList.add('changed');\n    setTimeout(() => card.classList.remove('changed'), 3400);\n\n    const state = stateOf(s);\n    let note = `Now ${LABEL[state]}`;\n    if (state === 'merged') {\n      const free = STORIES.filter(x => x.needs.includes(s.n) && x.needs.every(isMerged)).length;\n      note = free ? `Merged \u00b7 Unblocks ${free} ${free === 1 ? 'Story' : 'Stories'}` : 'Merged';\n    }\n    const toast = document.createElement('div');\n    toast.className = 'toast';\n    toast.style.animationDelay = `${i * 120}ms`;\n    toast.innerHTML = `<i style=\"--c:${state === 'merged' ? 'var(--lime)' : 'var(--accent)'}\"><\/i><div><b>${s.key} ${s.name}<\/b><span>${note}<\/span><\/div>`;\n    box.appendChild(toast);\n    setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 400); }, 7000 + i * 400);\n  });\n}\n\nfunction avatar(code, sm) {\n  const p = personOf(code);\n  return `<span class=\"avatar${sm ? ' sm' : ''}\" style=\"--c:${p.c}\" aria-hidden=\"true\">${p.init}<\/span>`;\n}\n\nfunction buildCards() {\n  for (const stage of STAGES) {\n    const col = document.createElement('div');\n    col.className = 'stage' + (stage.wide ? ' wide' : '');\n    col.innerHTML = `<div class=\"stage-head\"><b>${stage.label}<\/b><span data-stage><\/span><\/div><div class=\"cards\"><\/div>`;\n    const cards = col.querySelector('.cards');\n    for (const n of stage.ids) {\n      const s = BY_N[n];\n      const el = document.createElement('div');\n      el.className = 'card';\n      el.style.setProperty('--d', `${380 + STAGES.indexOf(stage) * 170 + stage.ids.indexOf(n) * 28}ms`);\n      el.dataset.id = n;\n      el.tabIndex = 0;\n      el.setAttribute('role', 'button');\n      el.innerHTML = `<div class=\"top\"><span class=\"kind kind-${s.kind}\"><\/span>${s.key}<span data-pr><\/span><span data-checks><\/span><span class=\"pts\" title=\"Story points\">${s.pts}<\/span><\/div>\n        <div class=\"name\" title=\"${s.name}\">${s.name}<\/div>\n        <div class=\"who\">${avatar(s.who, true)}${personOf(s.who).name}<\/div>\n        <div class=\"status\" data-chip><\/div>\n        <div class=\"detail\" data-detail><\/div>`;\n      const tile = document.createElement('div');\n      tile.className = 'tile';\n      tile.appendChild(el);\n      cards.appendChild(tile);\n    }\n    flow.appendChild(col);\n  }\n}\n\nconst title = t => t.replace(/\\b\\w/g, c => c.toUpperCase());\nfunction ago(iso) {\n  const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));\n  if (mins < 1) return 'Just Now';\n  if (mins < 60) return `${mins} Minute${mins === 1 ? '' : 's'} Ago`;\n  const h = Math.round(mins / 60);\n  if (h < 48) return `${h} Hour${h === 1 ? '' : 's'} Ago`;\n  return `${Math.round(h / 24)} Days Ago`;\n}\n\nfunction render() {\n  STAGES.forEach((stage, i) => {\n    const stories = stage.ids.map(n => BY_N[n]);\n    const done = stories.filter(s => stateOf(s) === 'merged').length;\n    flow.querySelectorAll('[data-stage]')[i].textContent =\n      `${done} of ${stories.length} Merged \u00b7 ${stories.reduce((t, s) => t + s.pts, 0)} Points`;\n  });\n\n  for (const el of flow.querySelectorAll('.card')) {\n    const s = BY_N[+el.dataset.id];\n    const st = STATUS[s.key] || {};\n    const state = stateOf(s);\n    el.className = el.className.replace(/\\bis-\\w+/g, '').trim() + ' is-' + (CARD_LOOK[state] || state);\n    const prLink = (cls, label) => `<a class=\"chip ${cls}\" href=\"${st.url}\" target=\"_blank\" rel=\"noopener\" title=\"Open pull request #${st.pr}\">${label}<\/a>`;\n    let chip = '';\n    if (state === 'merged') chip = prLink('merged', ICON.check + 'Merged');\n    else if (state === 'approved') chip = prLink('open', ICON.check + 'Approved');\n    else if (state === 'changes') chip = prLink('changes', 'Changes Requested');\n    else if (state onts && document.fonts.ready.then(layout);\nnew ResizeObserver(layout).observe(page);\nsetInterval(() => { if (checkedAt) render(); }, 60000);\n\nconst hoverable = matchMedia('(hover: hover)').matches;\nflow.addEventListener('mouseover', e => {\n  if (!hoverable) return;\n  const c = e.target.closest('.card');\n  const n = c ? +c.dataset.id : null;\n  if (n !== hovered) { hovered = n; applyHighlight(); }\n});\nflow.addEventListener('mouseleave', () => { hovered = null; applyHighlight(); });\ndocument.addEventListener('click', e => {\n  if (e.target.closest('a')) return;\n  const who = e.target.closest('.person');\n  if (who) {\n    person = person === who.dataset.person ? null : who.dataset.person;\n    selected = null;\n    render();\n    return;\n  }\n  const c = e.target.closest('.card');\n  selected = c && selected !== +c.dataset.id ? +c.dataset.id : null;\n  if (c) person = null;\n  render();\n});\nflow.addEventListener('keydown', e => {\n  const c = e.target.closest('.card');\n  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.click(); }\n});\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') { selected = null; person = null; render(); } });\n\n// Live PR status, read from GitHub's public API by this browser. GitHub allows 60 requests an hour per network\n// without signing in, shared by everyone on that network, so the page reads every 5 minutes while it is on screen\n// (2 requests, plus 2 per open pull request), keeps finished check results, and waits out the limit if it is hit.\nconst API = 'https://api.github.com/repos/jlroch2024/TrueSight';\nconst EVERY = 5 * 60000;\nconst FAILED = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale']);\nconst PASSED = new Set(['success', 'neutral', 'skipped']);\nconst saved = {\n  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* wap\">\n<style>\n/* Layout: the app's blueprint sheet. A summary band (progress, team), then Sprint 5 as a left-to-right merge-order\n   flow. Each story is a raised tile showing its owner and its pull request's state, read live from GitHub's public\n   API by the visitor's browser. Deliberately one dark look, the same as TrueSight itself. */\n:root {\n  color-scheme: dark;\n  --bg: #07141a;\n  --panel: #0c232b;\n  --panel-top: #12313b;\n  --border: #2a4a53;\n  --border-strong: #3b636c;\n  --text: #eef8f5;\n  --muted: #a6c2be;\n  --faint: #6a8c8e;\n  --accent: #2dd4bf;\n  --lime: #c4f36a;\n  --amber: #f5b73b;\n  --danger: #ff7a7a;\n  --setup: #93b5ff;\n  --font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  color: var(--text);\n  background-color: var(--bg);\n  background-image: linear-gradient(rgb(45 212 191 / 3%) 1px, transparent 1px),\n    linear-gradient(90deg, rgb(45 212 191 / 3%) 1px, transparent 1px);\n  background-size: 32px 32px;\n  font-size: 16px;\n  line-height: 1.45;\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: inherit; }\n\n.page {\n  max-width: 1440px;\n  margin: 0 auto;\n  padding-block: 52px 64px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n  display: grid;\n  gap: 40px;\n}\n\n/* Header */\n.hero { display: grid; grid-template-columns: auto 1fr; gap: 8px 32px; align-items: end; }\n.sprint-num {\n  grid-row: span 3; font-size: clamp(88px, 11vw, 150px); line-height: .78; font-weight: 700; letter-spacing: -.05em;\n  color: transparent; -webkit-text-stroke: 2px var(--accent);\n}\n.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 600; font-size: 15px; letter-spacing: .03em; }\n.eyebrow svg { width: 22px; height: 22px; }\nh1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }\n.live { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; color: var(--muted); font-size: 15px; }\n.live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 8px; vertical-align: 1px; }\n.live.on .dot { background: var(--lime); box-shadow: 0 0 0 4px rgb(196 243 106 / 15%); animation: pulse 2s ease-in-out infinite; }\n.live.stale .dot { background: var(--amber); }\n.live button {\n  font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--border);\n  padding: 3px 10px; cursor: pointer;\n}\n.live button:hover:not(:disabled), .live button:focus-visible { color: var(--text); border-color: var(--border-strong); outline: none; }\n.live button:disabled { opacity: .5; cursor: default; }\n\n/* Summary band */\n.summary { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }\n.panel {\n  background: linear-gradient(180deg, var(--panel-top), var(--panel));\n  border: 1px solid var(--border);\n  box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%), 0 18px 40px -24px rgb(0 0 0 / 80%);\n  padding: 20px 22px;\n}\n.panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }\n.figures { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-bottom: 18px; }\n.figure b { display: block; font-size: 34px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }\n.figure b small { font-size: 18px; color: var(--muted); font-weight: 500; }\n.figure span { color: var(--muted); font-size: 14px; }\n.bar { display: flex; height: 12px; background: rgb(255 255 255 / 4%); border: 1px solid var(--border); overflow: hidden; }\n.bar i { display: block; height: 100%; transition: width .6s ease; }\n/* The bar moves: a light sweeps across what is merged, and stripes run through work still under way. */\n.bar .merged {\n  background: linear-
